[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boltztracer"
version = "0.2.0"
description = "A small tracer for agent runs: steps, model calls, tools, sub-agents, cost."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "BoltzLabs" }]
keywords = ["tracing", "agents", "llm", "evals", "opentelemetry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# No dependencies. A tracer is imported into somebody else's agent, so every
# package it pulled in would be a version conflict waiting in their project.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://boltzlabs.cloud"

[tool.hatch.build.targets.wheel]
packages = ["boltztracer"]

[tool.hatch.build.targets.sdist]
include = ["boltztracer", "examples", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
